<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Consulta de Proyectos</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Consulta de Proyectos</h1>
        <p class="muted">Estado de los proyectos de desarrollo, sin necesidad de acceso a GitHub.</p>
      </div>
    </div>

    <form id="login-form" novalidate>
      <label for="email">Correo corporativo</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <p class="muted small">El acceso es solo para personal autorizado. Las cuentas las crea el administrador.</p>
  </main>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
